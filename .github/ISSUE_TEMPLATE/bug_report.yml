name: 버그 제보
description: 재현 가능한 오류와 실행 환경을 기록합니다.
title: "[버그] "
body:
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 커밋·브라우저 또는 에뮬레이터·mock/real 모드를 적습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 순서
      placeholder: "1. 시작 상태\n2. 수행한 행동\n3. 발생한 현상"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 참고 자료
      description: 관련 화면 ID·이슈·오류 로그·스크린샷이 있으면 첨부합니다. 인증 정보와 개인 정보는 제외합니다.
