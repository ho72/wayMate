name: 개발 작업
description: 기능·개발 환경·문서 작업을 등록합니다.
title: "[작업] "
body:
  - type: input
    id: references
    attributes:
      label: 관련 작업·기능·화면
      placeholder: "예: W02 / DM03 / M04·P01"
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - 웹
        - 서버·API
        - 차량 UI
        - 차량 통신·플랫폼·SDK
        - 공통 계약·데이터
        - 디자인·소재
        - 문서·시연·검수
        - 개발 환경·저장소
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: 수정 경로와 인계물
      description: 소유할 폴더·파일과 다른 담당자에게 넘길 산출물을 적습니다. 분담 가이드의 책임 경계를 참고합니다.
      placeholder: "경로: vehicle-app/.../ui/screens/handoff/\n인계물: 화면 상태와 콜백을 받는 P01 화면"
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: 공통 계약 영향
      description: API·필드·enum·소재 ID 변경과 생산자·소비자·예제를 적습니다. 없으면 '없음'으로 표시합니다.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 구현 범위
      description: 필요한 동작과 변경할 대상을 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 확인할 동작·산출물·검수 방법을 적습니다.
      placeholder: "- [ ] 확인할 동작 또는 산출물"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업과 참고 자료
      description: 먼저 필요한 이슈·문서·SDK 확인 사항이 있으면 적습니다.
