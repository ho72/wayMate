name: Mobile service checks
on:
  pull_request:
    paths: ["service/**", "mock-app/assets/images/design-v5/**", ".github/workflows/service-checks.yml"]
  push:
    branches: [main]
    paths: ["service/**", "mock-app/assets/images/design-v5/**", ".github/workflows/service-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  account-and-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: service/.nvmrc
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
