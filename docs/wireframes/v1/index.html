<title>wayMate 화면 설계 검토 v0.1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#222;background:#eee}
header{position:sticky;top:0;background:white;border-bottom:1px solid #bbb;padding:16px 24px;z-index:2}

<header><h1>wayMate 목업 화면 설계서 · 50개 화면</h1>

<label>번호·제목 <input id="query" type="search" placeholder="WF-019 또는 장소" aria-label="화면 번호 또는 제목 검색"></label>

</header><main id="book"></main><script>
const screens=[{"id": "WF-001", "title": "내 친구와 시작", "channel": "mobile", "scope": "B"}, {"id": "WF-002", "title": "에이전트와 온보딩 대화", "channel": "mobile", "scope": "B"}, {"id": "WF-003", "title": "캐릭터·본인 요약 확인", "channel": "mobile", "scope": "B"}, {"id": "WF-004", "title": "공개 소개 미리보기", "channel": "mobile", "scope": "B"}, {"id": "WF-005", "title": "대화로 여행 계획 확인", "channel": "mobile", "scope": "B"}, {"id": "WF-006", "title": "내 친구가 후보를 먼저 제안", "channel": "mobile", "scope": "B"}, {"id": "WF-007", "title": "상대 소개·연결 요청", "channel": "mobile", "scope": "B"}, {"id": "WF-008", "title": "공통 시간 재확인", "channel": "mobile", "scope": "B"}, {"id": "WF-009", "title": "모바일에서 차량으로 이어주기", "channel": "mobile", "scope": "B"}, {"id": "WF-010", "title": "상대 없이도 내 친구와 여행", "channel": "mobile", "scope": "B"}, {"id": "WF-011", "title": "차량에서 내 여행 불러오기", "channel": "car", "scope": "B"}, {"id": "WF-012", "title": "기본 홈 · 큰 내 친구", "channel": "car", "scope": "B"}, {"id": "WF-013", "title": "콘텐츠 선택 · 캐릭터 상단 축소", "channel": "car", "scope": "B"}, {"id": "WF-014", "title": "상대의 캐릭터와 대화", "channel": "car", "scope": "B"}, {"id": "WF-015", "title": "상대에게 전할 말 확인", "channel": "car", "scope": "B"}, {"id": "WF-016", "title": "답장·후속 질문 확인", "channel": "car", "scope": "B"}, {"id": "WF-017", "title": "직접 통화 제안·동의 대기", "channel": "car", "scope": "B"}, {"id": "WF-018", "title": "통화 샘플 · 발화자와 중단", "channel": "car", "scope": "B"}, {"id": "WF-019", "title": "만남 제안 · 일정과 전체 부담", "channel": "car", "scope": "B"}, {"id": "WF-020", "title": "같은 약속에 대한 상대 응답 대기", "channel": "car", "scope": "B"}, {"id": "WF-021", "title": "만남 카페 경유지 추가 승인", "channel": "car", "scope": "B"}, {"id": "WF-022", "title": "내비 요청 중 · 지도는 아직 유지", "channel": "car", "scope": "B"}, {"id": "WF-023", "title": "내비 반영 확인 · 캐릭터로 복귀", "channel": "car", "scope": "B"}, {"id": "WF-024", "title": "명시적 내비 실패 · 재확인", "channel": "car", "scope": "B"}, {"id": "WF-025", "title": "결과 미확인 · 중복 요청 잠금", "channel": "car", "scope": "B"}, {"id": "WF-026", "title": "약속 취소와 경유지 제거", "channel": "car", "scope": "B"}, {"id": "WF-027", "title": "첫 만남 재연", "channel": "car", "scope": "B"}, {"id": "WF-028", "title": "만남 뒤 두 가지 여행 선택", "channel": "car", "scope": "B"}, {"id": "WF-029", "title": "함께할지 상대 선택 기다리기", "channel": "car", "scope": "B"}, {"id": "WF-030", "title": "함께 여행 이어가기", "channel": "car", "scope": "B"}, {"id": "WF-031", "title": "내 친구와 여행 계속하기", "channel": "car", "scope": "B"}, {"id": "WF-032", "title": "주행 제한 · 앱 축소 또는 차단", "channel": "car", "scope": "B"}, {"id": "WF-033", "title": "주차 복귀 · 현재 상태부터", "channel": "car", "scope": "B"}, {"id": "WF-034", "title": "내 친구에게 장소를 물어보기", "channel": "car", "scope": "E"}, {"id": "WF-035", "title": "시간 조건에 맞춘 장소 목록", "channel": "car", "scope": "E"}, {"id": "WF-036", "title": "장소 상세 · 실행 전 판단", "channel": "car", "scope": "E"}, {"id": "WF-037", "title": "개인 장소 · 기존 목적지 유지", "channel": "car", "scope": "E"}, {"id": "WF-038", "title": "목적지 없음 · 새 안내 설정", "channel": "car", "scope": "E"}, {"id": "WF-039", "title": "저장된 일정과 순정 내비", "channel": "car", "scope": "E"}, {"id": "WF-040", "title": "시연자 패널 · 현재 요청만 제어", "channel": "operator", "scope": "B"}, {"id": "WF-041", "title": "재시연·전체 초기화 확인", "channel": "operator", "scope": "B"}, {"id": "WF-042", "title": "MC 통화 · 별도 참여 동의", "channel": "car", "scope": "O"}, {"id": "WF-043", "title": "여행 후 기록·장식", "channel": "car", "scope": "O"}, {"id": "WF-044", "title": "점심 질문에 맞춘 식사 장소 목록", "channel": "car", "scope": "E"}, {"id": "WF-045", "title": "식사 장소 상세 · 내 일정과 비교", "channel": "car", "scope": "E"}, {"id": "WF-046", "title": "개인 안내 요청 중 · 선택한 장소 유지", "channel": "car", "scope": "E"}, {"id": "WF-047", "title": "개인 경유지 반영 확인 · 원래 목적지 유지", "channel": "car", "scope": "E"}, {"id": "WF-048", "title": "새 목적지 반영 확인 · 경유지와 구분", "channel": "car", "scope": "E"}, {"id": "WF-049", "title": "개인 안내 명시 실패 · 같은 장소 다시 확인", "channel": "car", "scope": "E"}, {"id": "WF-050", "title": "개인 안내 결과 미확인 · 재요청 잠금", "channel": "car", "scope": "E"}];
const book=document.getElementById('book'),group=document.getElementById('group'),query=document.getElementById('query'),jump=document.getElementById('jump');
new ResizeObserver(()=>document.documentElement.style.setProperty('--head-height',document.querySelector('header').getBoundingClientRect().height+'px')).observe(document.querySelector('header'));
for(const s of screens){const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' '+s.title;jump.append(o);}
function render(){book.replaceChildren();const q=query.value.toLowerCase().trim();let count=0;
 for(const s of screens){if(group.value!=='all'&&s.channel!==group.value&&s.scope!==group.value)continue;if(q&&!(s.id+' '+s.title).toLowerCase().includes(q))continue;
 const f=document.createElement('figure');f.id=s.id;const im=document.createElement('img');im.src='pages/'+s.id+'.svg';im.alt=s.id+' '+s.title;im.width=1191;im.height=842;im.loading='lazy';
 const c=document.createElement('figcaption');c.textContent=s.id+' · '+s.title+' · '+s.scope+' | 피드백: 화면 번호 / 요소 1~5 / 문제와 변경안';f.append(im,c);book.append(f);count++;}
 if(!count){const p=document.createElement('p');p.textContent='일치하는 화면이 없습니다.';book.append(p);}}
group.addEventListener('change',render);query.addEventListener('input',render);jump.addEventListener('change',()=>{group.value='all';query.value='';render();location.hash=jump.value;document.getElementById(jump.value)?.scrollIntoView({behavior:'instant',block:'start'});});
render();if(location.hash){const id=location.hash.slice(1);if(screens.some(s=>s.id===id)){jump.value=id;requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView());}}
</script></body></html>
