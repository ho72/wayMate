<ellipse cx="712.0" cy="220.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="708.6" y="223.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">2</text>
<text x="456" y="219.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">내 친구</text>
<rect x="395" y="258" width="320" height="69" rx="3" fill="#F4F4F4" stroke="none" stroke-width="1"/>
<text x="407" y="281" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">쉬는 날에는 어떤 시간을 제일 좋아해? 네 말로 편하게</text>
<text x="407" y="299" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">얘기해줘.</text>
<ellipse cx="383.0" cy="279.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="379.6" y="282.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">3</text>
<text x="395" y="358.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">보낸 답변은 네 말투 그대로 남겨둘게.</text>
<text x="395" y="426.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">예시 · 안 골라도 괜찮아</text>
<rect x="395.0" y="439" width="156.0" height="34" rx="14" fill="#F4F4F4" stroke="#B8B8B8" stroke-width="1"/>
<text x="439.8" y="459.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">바다 보며 쉬기</text>
<rect x="559.0" y="439" width="156.0" height="34" rx="14" fill="#F4F4F4" stroke="#B8B8B8" stroke-width="1"/>
<text x="608.8" y="459.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">카페 가는 날</text>
<text x="395" y="501.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">답변 입력</text>
<rect x="395" y="512" width="320" height="94" rx="3" fill="#FFFFFF" stroke="#242424" stroke-width="1"/>
<text x="407" y="538.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#666666">편하게 네 말로 적어줘…</text>
<text x="621.1659999999999" y="623.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="9" fill="#666666">0 / 500 · Enter 줄바꿈</text>
<ellipse cx="383.0" cy="539.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="379.6" y="542.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">4</text>
<rect x="395" y="640" width="320" height="41" rx="3" fill="#FAFAFA" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="490.14" y="663.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#666666">이 답변 보내기 [입력 후]</text>
<ellipse cx="383.0" cy="660.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="379.6" y="663.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">5</text>
<rect x="395" y="689" width="320" height="41" rx="3" fill="#F4F4F4" stroke="#242424" stroke-width="1"/>
<text x="516.82" y="712.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">직접 답변 쓰기</text>
<text x="762" y="153.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">요소 번호 / 동작 명세</text>
<text x="762" y="181.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">1  역할·상태</text>
<text x="762" y="201.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">내 친구 / 설계</text>
<line x1="762" y1="216" x2="1151" y2="216" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="235.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">2  캐릭터</text>
<text x="762" y="255.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">한 명의 발화자만 상단에 축소해 출처를 유지.</text>
<line x1="762" y1="270" x2="1151" y2="270" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="289.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">3  대사·조건</text>
<text x="762" y="309.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">예시는 전송하지 않음. 자유 입력과 AI 자동 분석은 별개</text>
<line x1="762" y1="324" x2="1151" y2="324" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="343.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">4  정보·실패</text>
<text x="762" y="363.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">공백/500자 초과/저장 중 전송 잠금. 실패 시 초안·원문 보존</text>
<line x1="762" y1="378" x2="1151" y2="378" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="397.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">5  버튼 → 결과</text>
<text x="762" y="421.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">이 답변 보내기 [조건 충족 후]</text>
<text x="762" y="440" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">answerText 저장 후 해당 후속 또는 다음 기본 질문. 추가 문답 포함 완료 뒤 WF-003</text>
<text x="762" y="455" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">→ WF-002</text>
<text x="762" y="482.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">직접 답변 쓰기</text>
<text x="762" y="501" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">입력창 초점. 예시 선택·자동 전송 없음 → WF-002</text>
<text x="40" y="786.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">피드백 예: WF-002 / 요소 4 / 표시·문구·동작 중 수정할 점</text>
</svg>