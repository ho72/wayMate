<text x="40" y="644.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">소개·동일 고정 일정을 보여주고 ‘이 시연 여행으로 시작’. 기존</text>
<text x="40" y="662.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">준비 덮어쓰기·자동 선택 없음.</text>
