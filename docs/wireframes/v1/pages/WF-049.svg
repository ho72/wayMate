<text x="762" y="440" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">질문에 따라 WF-036/045/039 → WF-037/038에서 새 승인 → WF-036</text>
