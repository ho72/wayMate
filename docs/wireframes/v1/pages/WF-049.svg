<text x="762" y="363.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">실패 후 선택 장소를 잃거나 다른 장소로 자동 대체하지 않음</text>
