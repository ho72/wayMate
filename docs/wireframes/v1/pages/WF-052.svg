<text x="40" y="555.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">설명·판단·제어가 우선. 캐릭터는 화면에서 잠시 제외.</text>
<text x="40" y="593.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">시연·범위 메모</text>
<line x1="40" y1="605.9" x2="350" y2="605.9" stroke="#B8B8B8" stroke-width="1"/>
<text x="40" y="626.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">기존 공개는 재승인 강요 없이 현재 범위를 표시. 연결 종료 뒤</text>
<text x="40" y="644.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">이 상태는 철회만 제공하고 새 추천 버튼은 숨긴다.</text>
<text x="378" y="129.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">화면 확대 / 구성·버튼의 상대적 배치</text>
