<text x="405" y="535.8333333333334" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">각각 확인</text>
<text x="405" y="552.8333333333334" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">소개 [미확인] / 여행 요약 [미확인]</text>
<rect x="395" y="640" width="320" height="41" rx="3" fill="#FAFAFA" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="4 3"/>
