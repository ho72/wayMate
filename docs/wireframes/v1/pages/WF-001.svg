<rect x="395" y="376" width="320" height="52" rx="3" fill="#F1F1F1" stroke="none" stroke-width="1"/>
<text x="407" y="398" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">함께 여행할 친구야. 먼저 너를 조금 알아가도 될까?</text>
<ellipse cx="383.0" cy="396.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
