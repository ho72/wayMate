<text x="405" y="478.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">실제 가입 대신 준비된 질문으로 체험해요.</text>
<ellipse cx="383.0" cy="460.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
