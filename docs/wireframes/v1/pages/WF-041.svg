<svg xmlns="http://www.w3.org/2000/svg" width="1191" height="842" viewBox="0 0 1191 842" role="img" aria-labelledby="title desc">
<title id="title">WF-041  재시연·전체 초기화 확인</title>
<desc id="desc">wayMate 목업 검토용 화면 설계도. 번호는 화면 및 요소 피드백 식별자다.</desc>
<rect width="1191" height="842" fill="white"/>
<rect x="0" y="0" width="1191" height="842" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="40" y="39.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#666666">wayMate / 화면 설계서</text>
<text x="780" y="38.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">v0.4  |  2026-11-11  |  피드백 번호 WF-041</text>
<line x1="40" y1="48" x2="1151" y2="48" stroke="#B8B8B8" stroke-width="1"/>
<text x="40" y="87.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#242424">WF-041  재시연·전체 초기화 확인</text>
<line x1="40" y1="804" x2="1151" y2="804" stroke="#B8B8B8" stroke-width="1"/>
<text x="40" y="824.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="9" fill="#666666">목업 설계 · 담당자 미정 · 마감 미정 · 실제 기능/주행/SDK 검증 완료를 뜻하지 않음</text>
<text x="1121" y="825.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">46</text>
<text x="40" y="115.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#666666">시연자  |  기본 목업  |  O01.REPLAY / RESET  |  전체 / DM11</text>
<text x="40" y="152.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">시연 PC의 별도 제어 화면</text>
<rect x="40" y="143" width="690" height="456" rx="3" fill="#FFFFFF" stroke="#242424" stroke-width="1"/>
<text x="60" y="178.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" fill="#242424">O01 / 시연자 제어</text>
<ellipse cx="45.0" cy="172.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="41.6" y="175.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">1</text>
<text x="60" y="209.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">현재 회차 · 대상 요청 · 실제/모의 · 제한 상태</text>
<rect x="60" y="229" width="650" height="58" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
<text x="73" y="252" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">최종 선택 재시연과 처음부터 시작은 정리 범위가 다릅니다.</text>
<ellipse cx="45.0" cy="250.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="41.6" y="253.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">3</text>
<rect x="60" y="304" width="650" height="57" rx="0" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/>
<text x="72" y="324.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">최종 선택 재시연</text>
<text x="72" y="343.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">새 finalId·round / A 선택부터 / 새 B 요청은 together 때만</text>
<ellipse cx="45.0" cy="324.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="41.6" y="327.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">4</text>
<rect x="60" y="371" width="650" height="57" rx="0" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/>
<text x="72" y="391.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">처음부터 시작</text>
<text x="72" y="410.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">서버·필수 차량 ACK·경유지 확인. 탑승 후 닫힌 모바일 제외</text>
<rect x="60" y="438" width="650" height="57" rx="0" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/>
<text x="72" y="458.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">실제 외부 효과</text>
<text x="72" y="477.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">초기화해도 실제 내비가 자동으로 정리된 것은 아님</text>
<rect x="60" y="528" width="210" height="48" rx="3" fill="#E5E5E5" stroke="#242424" stroke-width="1"/>
<text x="124.89" y="554.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">최종 선택 재시연</text>
<ellipse cx="45.0" cy="550.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="41.6" y="553.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">5</text>
<rect x="280" y="528" width="210" height="48" rx="3" fill="#E5E5E5" stroke="#242424" stroke-width="1"/>
<text x="344.89" y="554.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">처음부터 새 시연</text>
<rect x="500" y="528" width="210" height="48" rx="3" fill="#E5E5E5" stroke="#242424" stroke-width="1"/>
<text x="566.57" y="554.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">패널로 돌아가기</text>
<text x="40" y="638.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">목적·진입</text>
<line x1="40" y1="650" x2="730" y2="650" stroke="#B8B8B8" stroke-width="1"/>
<text x="40" y="671" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">시연 편의를 위해 과거 동의·실제 경로를 되살리지 않는다. 유효한 결과 또는 초기화 요청</text>
<text x="762" y="153.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">요소 번호 / 동작 명세</text>
<text x="762" y="181.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">1  역할·상태</text>
<text x="762" y="201.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">시연자 전용 / 설계</text>
<line x1="762" y1="216" x2="1151" y2="216" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="235.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">2  캐릭터</text>
<text x="762" y="255.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">캐릭터를 숨겨 선택·경로 확인 정보가 읽히게 함.</text>
<line x1="762" y1="270" x2="1151" y2="270" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="289.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">3  대사·조건</text>
<text x="762" y="309.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">운전자 정리 승인·실제 제한·복구 증빙을 우회하지 않음</text>
<line x1="762" y1="324" x2="1151" y2="324" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="343.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">4  정보·실패</text>
<text x="762" y="363.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">미완료 항목 표시 후 대기. 미확정 상태를 성공으로 덮지 않음</text>
<line x1="762" y1="378" x2="1151" y2="378" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="397.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">5  버튼 → 결과</text>
<text x="762" y="421.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">최종 선택 재시연</text>
<text x="762" y="440" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">checkpoint 유효·잠금 없음. 이전 B 응답 무효 → WF-028</text>
<text x="762" y="467.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">처음부터 새 시연</text>
<text x="762" y="486" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">정리/ACK 완료 후 모바일 매칭부터. 차량 본인 시작만 WF-053 → WF-001</text>
<text x="762" y="513.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">패널로 돌아가기</text>
<text x="762" y="532" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">상태 변경 없음 → WF-040</text>
<text x="40" y="786.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">피드백 예: WF-041 / 요소 4 / 표시·문구·동작 중 수정할 점</text>
</svg>