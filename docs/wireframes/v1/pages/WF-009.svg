<text x="405" y="513.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">전달 준비 → 차량 불러오기 → 차량 수신 확인</text>
<text x="405" y="528.3" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="9.3" fill="#666666">준비 완료와 차량 확인을 분리</text>
