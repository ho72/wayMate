<text x="405" y="343.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">전달할 정보</text>
<text x="405" y="360.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">파도 · 선택한 외형·말투 · 현재 계획</text>
