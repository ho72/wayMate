<text x="45" y="651" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">확대도는 세로 앱 창의 논리 배치다. 넓고 낮은 창에서는 캐릭터·현재 정보와 선택 영역을 나란히 둔다. 창이 좁아지면 캐릭터부터 줄이고 한 번에 읽을 정보량을 낮춘다. 상태·행동·자막이 잘리면 시스템 창을 가리지 않고</text>
<text x="45" y="669" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">스크롤/페이지로 분리한다.</text>
