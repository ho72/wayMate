<text x="45" y="651" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">확대도는 앱 창의 논리 배치다. 넓고 낮은 창은 캐릭터/현재 정보와 선택 영역을 나란히 두고, 좁으면 캐릭터부터 줄인다. V는 실제 지원 검증이 필요한 목표 모드다. 현재 미검증 목업은 주차/발표용 대본으로 재현하고 실</text>
