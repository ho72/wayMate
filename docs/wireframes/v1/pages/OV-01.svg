<text x="60" y="509.59999999999997" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="8.5" fill="#666666">배치 개념도 · 앱 창 비율 2:1 · 실차 해상도/순정 UI 재현 아님</text>
<text x="790" y="193.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="28" fill="#242424">wayMate</text>
<text x="790" y="233.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">내비와의 관계</text>
<line x1="790" y1="245" x2="1140" y2="245" stroke="#B8B8B8" stroke-width="1"/>
<text x="790" y="266" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">순정 내비는 시스템 앱 창. wayMate는 별도 앱 창 안에서 캐릭터·제안·</text>
<text x="790" y="284" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">확인·결과를 제공한다.</text>
<text x="790" y="322.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">캐릭터의 역할</text>
<line x1="790" y1="334" x2="1140" y2="334" stroke="#B8B8B8" stroke-width="1"/>
<text x="790" y="355" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">큰 내 친구 → 조건을 읽는 작은 친구 → 목록·경로 확인 → 결과를 알려</text>
<text x="790" y="373" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">주는 친구의 흐름.</text>
<text x="790" y="411.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">이번 설계의 결과물</text>
<line x1="790" y1="423" x2="1140" y2="423" stroke="#B8B8B8" stroke-width="1"/>
<text x="790" y="444" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">색·장식보다 화면 구조, 발화자, 동의, 내비 실행 경계, 실패와 제한 분기</text>
<text x="790" y="462" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">를 우선한 저해상도 설계도.</text>
<text x="60" y="578.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">검토 기준</text>
<line x1="60" y1="590" x2="750" y2="590" stroke="#B8B8B8" stroke-width="1"/>
<text x="60" y="611" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">Git docs 01~05 v0.5 + 06 협업 가이드 + 07 현재 구현. 기준 커밋 17126ff. 담당자·마감 미정. 화면은 설계 결과이며 현재 앱의 기능 완</text>
<text x="60" y="629" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">료 현황은 07이 기준.</text>
<text x="60" y="734.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#242424">피드백: WF-019 / 요소 4 / 대기시간을 더 먼저 보여주세요.</text>
