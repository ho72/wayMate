<text x="40" y="218" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">내 친구가 매칭 실패 뒤에만 생기는 보상이 아님을 보여준다.</text>
