<text x="762" y="437.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">차량에서 내 여행 이어가기</text>
<text x="762" y="456" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">my_trip HANDOFF_PREPARE → WF-011</text>
<text x="762" y="483.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">소개 공개 확인</text>
<text x="762" y="502" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">연결 시도 전만 가능. 종료 후 새 연결은 전체 초기화 → WF-004</text>
<text x="40" y="786.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">피드백 예: WF-010 / 요소 4 / 표시·문구·동작 중 수정할 점</text>
