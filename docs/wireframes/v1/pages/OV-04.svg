<text x="270" y="411.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#666666">실패 WF-024 / 미확인 WF-025 / 취소·제거 WF-026</text>
<text x="48" y="495.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">차량 특화 E 확장</text>
<rect x="250" y="478" width="880" height="62" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
