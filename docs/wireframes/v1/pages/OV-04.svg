<text x="270" y="523.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#666666">30분 휴식과 점심 요청을 분리. 개인 장소와 공유 만남의 승인·데이터도 분리</text>
<text x="48" y="607.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">공통·시연·추가</text>
<rect x="250" y="590" width="880" height="62" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
