<text x="48" y="159.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">모바일 준비</text>
<rect x="250" y="142" width="880" height="62" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
<text x="270" y="164.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">WF-001~005 → WF-006~009 → 차량</text>
<text x="270" y="187.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#666666">공개 보류·요청 거절은 WF-010 → 본인 여행</text>
<text x="48" y="271.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">캐릭터와 알아가기</text>
<rect x="250" y="254" width="880" height="62" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
<text x="270" y="276.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">WF-011 → WF-012 ↔ WF-013~018</text>
<text x="270" y="299.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#666666">콘텐츠를 모두 완료하지 않아도 WF-019 만남 제안</text>
<text x="48" y="383.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">만남·내비·결말</text>
<rect x="250" y="366" width="880" height="62" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
