<text x="708.6" y="223.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">2</text>
<rect x="395" y="258" width="320" height="52" rx="3" fill="#F1F1F1" stroke="none" stroke-width="1"/>
<text x="407" y="280" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#242424">네가 쓴 답변을 확인하고, 소개에 쓸 내용도 골라줘.</text>
<ellipse cx="383.0" cy="278.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="379.6" y="281.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">3</text>
<rect x="395" y="324" width="320" height="77.66666666666667" rx="2" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/>
<text x="405" y="343.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">내가 쓴 답변</text>
<text x="405" y="360.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">바다 보면서 멍때리다가 카페 가는 게 좋아 ㅋㅋ</text>
<text x="405" y="375.3" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="9.3" fill="#666666">원문은 본인에게만. AI 분석 결과가 아님</text>
<ellipse cx="383.0" cy="342.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="379.6" y="345.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">4</text>
<rect x="395" y="409.6666666666667" width="320" height="77.66666666666667" rx="2" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/>
<text x="405" y="429.1666666666667" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">별명·캐릭터</text>
<text x="405" y="446.1666666666667" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">질문 5: 파도 / 외형 두 개 중 선택</text>
<rect x="395" y="495.33333333333337" width="320" height="77.66666666666667" rx="2" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/>
<text x="405" y="514.8333333333334" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">소개 예시 · 본인이 확인</text>
<text x="405" y="531.8333333333334" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">바다·카페 / 여유롭게 / 조용한 대화</text>
<text x="405" y="545.8333333333334" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.5" fill="#242424">표현: 차분하게 또는 가벼운 농담</text>
<rect x="395" y="591" width="320" height="41" rx="3" fill="#E5E5E5" stroke="#242424" stroke-width="1"/>
<text x="516.82" y="614.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">이 소개값 확인</text>
<ellipse cx="383.0" cy="611.0" rx="10.0" ry="10.0" fill="#242424" stroke="#242424"/>
<text x="379.6" y="614.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#FFFFFF">5</text>
<rect x="395" y="640" width="320" height="41" rx="3" fill="#E5E5E5" stroke="#242424" stroke-width="1"/>
<text x="491.98" y="663.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">이 소개값은 쓰지 않을래</text>
<rect x="395" y="689" width="320" height="41" rx="3" fill="#E5E5E5" stroke="#242424" stroke-width="1"/>
<text x="518.66" y="712.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">답변 수정하기</text>
<text x="762" y="153.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#242424">요소 번호 / 동작 명세</text>
<text x="762" y="181.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">1  역할·상태</text>
<text x="762" y="201.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">내 친구 / 설계</text>
<line x1="762" y1="216" x2="1151" y2="216" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="235.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">2  캐릭터</text>
<text x="762" y="255.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">한 명의 발화자만 상단에 축소해 출처를 유지.</text>
<line x1="762" y1="270" x2="1151" y2="270" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="289.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">3  대사·조건</text>
<text x="762" y="309.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">자동 분석 없음. 표현도 별도 확인, 미확인이면 중립 대사</text>
<line x1="762" y1="324" x2="1151" y2="324" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="343.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">4  정보·실패</text>
<text x="762" y="363.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">별명 1~10자·원문과 소개값 검증 오류는 해당 입력 가까이에 표시</text>
<line x1="762" y1="378" x2="1151" y2="378" stroke="#B8B8B8" stroke-width="1"/>
<text x="762" y="397.5" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11.5" fill="#242424">5  버튼 → 결과</text>
<text x="762" y="421.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">이 소개값 확인</text>
<text x="762" y="440" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">본인이 확인한 supported 값만 confirmedSummary 저장 → WF-004</text>
<text x="762" y="467.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">이 소개값은 쓰지 않을래</text>
<text x="762" y="486" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">미확인값 비움. 최소 소개·본인 여행 유지 → WF-004</text>
<text x="762" y="513.7" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10.7" fill="#242424">답변 수정하기</text>
<text x="762" y="532" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#242424">해당 원문 수정. 기존 요약·공개·전달 재확인 → WF-002</text>
<text x="40" y="786.0" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="10" fill="#666666">피드백 예: WF-003 / 요소 4 / 표시·문구·동작 중 수정할 점</text>
