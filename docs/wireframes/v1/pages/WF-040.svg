<text x="40" y="671" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">운영자 이벤트와 사용자 동의·운전자 승인을 분리한다. 시연 PC의 별도 화면</text>
