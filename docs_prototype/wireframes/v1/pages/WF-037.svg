<text x="40" y="413.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">사용자 승인을 경계로 앱의 선택이 순정 내비 동작으로 이어진</text>
<text x="40" y="431.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">다.</text>
