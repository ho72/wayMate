<text x="40" y="644.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">실제 API 이름과 권한은 공식 자료에서 확인했지만 E 데이터·명</text>
<text x="40" y="662.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">령·앱 연동은 새 구현 계약이 필요하다.</text>
