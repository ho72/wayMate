<text x="40" y="573.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">설명·판단·제어가 우선. 캐릭터는 화면에서 잠시 제외.</text>
<text x="40" y="611.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">시연·범위 메모</text>
