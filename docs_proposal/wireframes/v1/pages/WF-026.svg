<text x="40" y="626.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">요청 전/미반영 확정은 내 친구로 바로 이동. 초기화 정리는 O0</text>
<text x="40" y="644.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">1 정리 화면으로 복귀한다.</text>
