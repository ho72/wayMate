<text x="40" y="540.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">캐릭터 배치</text>
<line x1="40" y1="552.9" x2="350" y2="552.9" stroke="#B8B8B8" stroke-width="1"/>
<text x="40" y="573.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">작은 정적 표시·짧은 상태만. 말하고 듣는 경험은 음성으로, 시</text>
<text x="40" y="591.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">각 허용 범위에서만 표시.</text>
<text x="40" y="629.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#242424">시연·범위 메모</text>
<line x1="40" y1="641.9" x2="350" y2="641.9" stroke="#B8B8B8" stroke-width="1"/>
<text x="40" y="662.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">현재 목업은 주차/발표에서 대본 음성으로 재현한다. 실제 마이</text>
<text x="40" y="680.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">크가 열릴 때만 듣는 중을 표시. 작은 정적 캐릭터도 시각 허용</text>
<text x="40" y="698.9" font-family="AppleGothic,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="11" fill="#242424">범위에서만 사용한다.</text>
