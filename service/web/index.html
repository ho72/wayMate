<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6faff" />
    <meta
      name="description"
      content="나를 알아가는 AI 여행 친구. 대화로 취향을 발견하고, 나다운 여행을 함께 준비해요."
    />
    <title>말이통행 · 나의 AI 여행 친구</title>
    <link rel="icon" type="image/png" href="/assets/dragon.png" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="desktop-sidebar" aria-label="서비스 메뉴">
        <a href="#home" class="brand"
          ><img src="/assets/dragon.png" alt="" /><span
            >말이통행<small>나의 AI 여행 친구</small></span
          ></a
        >
        <button class="new-chat main-button" data-action="new-chat">
          새로운 이야기
        </button>
        <nav class="side-navigation" aria-label="주 메뉴"></nav>
        <div class="history-heading">
          <span>함께 나눈 이야기</span
          ><button
            class="quiet icon-button"
            data-action="history"
            aria-label="대화 기록 보기"
          ></button>
        </div>
        <div id="sidebar-history" class="sidebar-history"></div>
        <div class="sidebar-bottom" id="sidebar-account"></div>
      </aside>
      <div class="app-main">
        <header id="mobile-header" class="mobile-header"></header>
        <main id="main-content" tabindex="-1">
          <div class="loading-state" role="status">친구와 연결하고 있어요.</div>
        </main>
        <section id="composer" class="composer-dock" hidden>
          <form id="message-form" aria-label="파도에게 메시지 보내기">
            <div class="composer-box">
              <label class="sr-only" for="message">친구에게 이야기하기</label>
              <textarea
                id="message"
                maxlength="4000"
                rows="1"
                placeholder="어디든, 어떤 이야기든 좋아요"
                aria-describedby="composer-detail"
              ></textarea>
              <button
                type="submit"
                id="send-message"
                class="send-button"
                aria-label="메시지 보내기"
                disabled
              ></button>
              <button
                type="button"
                id="stop-message"
                class="stop-button"
                data-action="stop"
                hidden
              >
                멈추기
              </button>
            </div>
            <div class="composer-detail" id="composer-detail">
              <span>AI의 제안은 직접 확인하고 저장해 주세요.</span
              ><span id="character-count"></span>
            </div>
          </form>
        </section>
        <nav
          id="bottom-navigation"
          class="bottom-navigation"
          aria-label="모바일 주 메뉴"
        ></nav>
      </div>
    </div>
    <dialog id="auth-dialog" aria-labelledby="auth-title">
      <button
        class="dialog-close icon-button quiet"
        data-action="close-dialog"
        aria-label="닫기"
      ></button>
      <img
        class="auth-character"
        src="/assets/dragon.png"
        alt="반갑게 손을 흔드는 파도"
      />
      <h2 id="auth-title">이야기를 오래 이어가요</h2>
      <p class="muted">나눈 대화와 여행을 내 공간에 남겨둘게요.</p>
      <div class="auth-tabs" role="tablist" aria-label="계정">
        <button type="button" role="tab" id="login-tab" aria-selected="true">
          로그인</button
        ><button
          type="button"
          role="tab"
          id="register-tab"
          aria-selected="false"
        >
          처음 왔어요
        </button>
      </div>
      <form id="auth-form">
        <label for="handle">아이디</label
        ><input
          id="handle"
          name="handle"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{2,31}"
          placeholder="영문·숫자로 3~32자"
          required
        />
        <div id="display-name-field" hidden>
          <label for="display-name">어떻게 불러줄까요?</label
          ><input
            id="display-name"
            name="displayName"
            autocomplete="nickname"
            maxlength="30"
            placeholder="편한 별명으로 알려주세요"
          />
        </div>
        <label for="password">비밀번호</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          maxlength="128"
          required
        />
        <p id="password-hint" class="field-hint" hidden>
          12자 이상으로 만들어 주세요. 다른 서비스의 비밀번호는 피하는 게
          좋아요.
        </p>
        <p id="auth-error" class="form-error" role="alert"></p>
        <button id="auth-submit" class="main-button full-width" type="submit">
          로그인하고 이어가기
        </button>
      </form>
    </dialog>
    <dialog id="history-dialog" aria-labelledby="history-title">
      <div class="dialog-title">
        <h2 id="history-title">함께 나눈 이야기</h2>
        <button
          class="icon-button quiet"
          data-action="close-dialog"
          aria-label="닫기"
        ></button>
      </div>
      <button
        id="history-filter"
        class="text-button"
        data-action="toggle-archive"
      >
        보관한 대화 보기
      </button>
      <div id="history-list"></div>
    </dialog>
    <dialog id="trip-dialog" aria-labelledby="trip-title">
      <div class="dialog-title">
        <h2 id="trip-title">나의 여행</h2>
        <button
          class="icon-button quiet"
          data-action="close-dialog"
          aria-label="닫기"
        ></button>
      </div>
      <div id="trip-content"></div>
    </dialog>
    <div
      id="notice"
      class="toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </body>
</html>
